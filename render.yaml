services:
  - type: web
    name: swaroop-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: MONGODB_DATABASE
        value: swaroop
      - key: CORS_ORIGINS
        value: "https://swaroop-hackshift.netlify.app,http://localhost:5173"
      - key: MONGODB_URI
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: server/uploads
